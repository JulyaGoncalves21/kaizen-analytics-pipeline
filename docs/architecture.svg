<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Kaizen analytics pipeline</title><desc id="desc">Synthetic registry and detail records flow through validation, pending handling and a business gate into a curated analytical layer.</desc><rect width="1040" height="420" fill="#f4f1e8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#16221d"><g fill="#fffdf7" stroke="#1f6b4f" stroke-width="3"><rect x="35" y="105" width="175" height="80" rx="5"/><rect x="35" y="235" width="175" height="80" rx="5"/><rect x="285" y="145" width="180" height="130" rx="5"/><rect x="540" y="80" width="175" height="90" rx="5"/><rect x="540" y="250" width="175" height="90" rx="5"/><rect x="790" y="145" width="210" height="130" rx="5"/></g><g font-size="17" font-weight="700"><text x="122" y="140">Synthetic registry</text><text x="122" y="165">and approvals</text><text x="122" y="270">Synthetic detail</text><text x="122" y="295">records</text><text x="375" y="195">Resolve</text><text x="375" y="220">Consolidate</text><text x="375" y="245">Validate</text><text x="627" y="120">Publishable</text><text x="627" y="145">records</text><text x="627" y="290">Pending</text><text x="627" y="315">queue</text><text x="895" y="195">Curated analytical</text><text x="895" y="220">layer</text><text x="895" y="245">for decisions</text></g></g><g fill="none" stroke="#d79c45" stroke-width="4"><path d="M210 145h75M210 275h75M465 180h75M465 240h75M715 125h75"/></g><g fill="#d79c45"><path d="m275 134 12 11-12 11m0 108 12 11-12 11m255-116 12 11-12 11m0 48 12 11-12 11m250-126 12 11-12 11"/></g><text x="520" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52615a">SYNTHETIC CSV ONLY · PER-RECORD ISOLATION · EXPLICIT HUMAN GATE · NO CORPORATE CONNECTION</text>
</svg>

